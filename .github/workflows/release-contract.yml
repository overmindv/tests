name: Release stack contract

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/release_stack.py
      - unit_tests/test_release_stack.py
      - requirements.txt
      - .github/workflows/release-contract.yml
  push:
    branches: [main]
    paths:
      - scripts/release_stack.py
      - unit_tests/test_release_stack.py
      - requirements.txt
      - .github/workflows/release-contract.yml

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest unit_tests/test_release_stack.py
