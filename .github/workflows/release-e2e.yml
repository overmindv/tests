name: Release E2E

on:
  workflow_call:
    inputs:
      tests_ref:
        description: Full commit SHA of the tests repository
        required: true
        type: string
      manifest:
        description: Contents of the published release.json from infra
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  release-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - name: Require private Overmindv caller
        id: guard
        env:
          PRIVATE_CALLER: ${{ github.event.repository.private }}
          CALLER_OWNER: ${{ github.repository_owner }}
          TESTS_REF: ${{ inputs.tests_ref }}
        run: |
          [[ "$PRIVATE_CALLER" == true && "$CALLER_OWNER" == overmindv ]]
          [[ "$TESTS_REF" =~ ^[0-9a-f]{40}$ ]]
          printf 'RELEASE_RUN_DIR=%s/release-ci-%s\n' "$RUNNER_TEMP" "$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s/release-docker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: overmindv/tests
          ref: ${{ inputs.tests_ref }}
          path: workspace/tests
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Resolve infra commit from release
        id: release
        env:
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_MANIFEST" > "$RUNNER_TEMP/release.json"
          ref="$(python3 workspace/tests/scripts/release_stack.py infra-ref --manifest "$RUNNER_TEMP/release.json")"
          printf 'infra_ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: overmindv/infra
          ref: ${{ steps.release.outputs.infra_ref }}
          path: workspace/infra
          persist-credentials: false
      - name: Install test dependencies
        working-directory: workspace/tests
        run: |
          python -m pip install -r requirements.txt
          npm --prefix user-simulation ci --ignore-scripts --registry=https://registry.npmjs.org
          cd user-simulation && npx --no-install playwright install --with-deps chromium
      - name: Prepare isolated Compose project
        run: |
          python3 workspace/tests/scripts/release_stack.py render --manifest "$RUNNER_TEMP/release.json" \
            --infra workspace/infra --run-dir "$RELEASE_RUN_DIR"
      - name: Sign in to GHCR
        id: registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Start and verify published images
        id: stack
        run: |
          python3 workspace/tests/scripts/release_stack.py start --manifest "$RUNNER_TEMP/release.json" \
            --infra workspace/infra --run-dir "$RELEASE_RUN_DIR"
      - name: Run API and browser journeys
        id: journeys
        working-directory: workspace/tests
        run: python3 scripts/run_e2e.py --infra-env "$RELEASE_RUN_DIR/stack.env"
      - name: Upload observed release
        if: always() && steps.stack.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observed-release
          path: ${{ env.RELEASE_RUN_DIR }}/observed-release.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized journey evidence
        if: always() && steps.journeys.outputs.evidence_safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-e2e-evidence
          path: |
            workspace/tests/allure-results/
            workspace/tests/user-simulation/artifacts/live-results/
            workspace/tests/user-simulation/artifacts/live-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Capture sanitized diagnostics
        id: diagnostics
        if: failure() && (steps.stack.outcome == 'failure' || steps.journeys.outcome == 'failure')
        working-directory: workspace/tests
        run: |
          python3 scripts/capture_diagnostics.py --infra-env "$RELEASE_RUN_DIR/stack.env" \
            --project-name "${RELEASE_RUN_DIR##*/}" --compose-file ../infra/docker-compose.yml \
            --compose-file "$RELEASE_RUN_DIR/locked.compose.yml" --output artifacts/release-diagnostics.txt
      - name: Upload sanitized diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-e2e-diagnostics
          path: workspace/tests/artifacts/release-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Stop test containers
        if: always() && steps.guard.outcome == 'success' && steps.release.outcome == 'success'
        run: |
          python3 workspace/tests/scripts/release_stack.py stop --infra workspace/infra \
            --run-dir "$RELEASE_RUN_DIR"
      - name: Sign out of GHCR
        if: always() && steps.registry.outcome == 'success'
        run: docker logout ghcr.io
