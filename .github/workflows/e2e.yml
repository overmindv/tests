name: e2e tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tests_ref:
        description: Exact tests commit used by the reusable integration gate
        required: false
        default: "main"
        type: string
      target_repo:
        description: Optional service checkout replaced by caller SHA
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-harness:
    if: github.repository == 'overmindv/tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest unit_tests
      - run: python -m pytest --collect-only -m e2e
      - run: npm --prefix user-simulation ci && cd user-simulation && npx playwright install --with-deps chromium
      - run: make simulation-check simulation-privacy

  e2e:
    # Private recommendations is read using its own caller GITHUB_TOKEN.
    # The full gate runs in recommendations CI; tests PR retains local harness checks.
    if: github.repository == 'overmindv/recommendations'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tests under review
        uses: actions/checkout@v4
        with:
          repository: overmindv/tests
          ref: ${{ inputs.tests_ref }}
          path: workspace/tests
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Load tested service refs
        id: refs
        working-directory: workspace/tests
        run: |
          python3 - <<'PYREFS'
          import json, os, re
          refs = json.load(open('ci/source-refs.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, ref in refs.items():
                  if not re.fullmatch(r'[0-9a-f]{40}', ref):
                      raise SystemExit(f'{name}: expected full commit SHA')
                  print(f'{name}={ref}', file=output)
          PYREFS

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: overmindv/infra
          ref: ${{ steps.refs.outputs['infra'] }}
          path: workspace/infra
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout users
        uses: actions/checkout@v4
        with:
          repository: overmindv/users
          ref: ${{ steps.refs.outputs['users'] }}
          path: workspace/users
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout entities
        uses: actions/checkout@v4
        with:
          repository: overmindv/entities
          ref: ${{ steps.refs.outputs['entities'] }}
          path: workspace/entities
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout tasks
        uses: actions/checkout@v4
        with:
          repository: overmindv/tasks
          ref: ${{ steps.refs.outputs['tasks'] }}
          path: workspace/tasks
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout task-hunter
        uses: actions/checkout@v4
        with:
          repository: overmindv/task-hunter
          ref: ${{ steps.refs.outputs['task-hunter'] }}
          path: workspace/task-hunter
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout recommendations
        uses: actions/checkout@v4
        with:
          repository: overmindv/recommendations
          ref: ${{ github.repository == 'overmindv/recommendations' && github.sha || steps.refs.outputs['recommendations'] }}
          path: workspace/recommendations
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Extract verified private sandbox source
        run: |
          python3 workspace/tests/scripts/extract_private_source.py \
            --archive workspace/recommendations/ci/vendor/sandbox.tar.gz \
            --manifest workspace/recommendations/ci/vendor/sandbox-source.json \
            --expected-ref '${{ steps.refs.outputs.sandbox }}' \
            --destination workspace/sandbox

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: overmindv/content
          ref: ${{ steps.refs.outputs['content'] }}
          path: workspace/content
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout media
        uses: actions/checkout@v4
        with:
          repository: overmindv/media
          ref: ${{ steps.refs.outputs['media'] }}
          path: workspace/media
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          repository: overmindv/feed
          ref: ${{ steps.refs.outputs['feed'] }}
          path: workspace/feed
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: overmindv/frontend
          ref: ${{ steps.refs.outputs['frontend'] }}
          path: workspace/frontend
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout api-gateway
        uses: actions/checkout@v4
        with:
          repository: overmindv/api-gateway
          ref: ${{ steps.refs.outputs['api-gateway'] }}
          path: workspace/api-gateway
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Checkout optional caller service
        if: inputs.target_repo != ''
        uses: actions/checkout@v4
        with:
          repository: overmindv/${{ inputs.target_repo }}
          ref: ${{ github.sha }}
          path: workspace/${{ inputs.target_repo }}
          token: ${{ secrets.ORGANIZATION_READ_TOKEN || github.token }}

      - name: Record actual tested source commits
        run: |
          python3 - <<'PYSOURCES'
          import json, pathlib, subprocess
          root = pathlib.Path('workspace')
          pinned = json.loads((root / 'tests/ci/source-refs.json').read_text())
          actual = {}
          for name in ['tests', *pinned]:
              if name == 'sandbox':
                  manifest = json.loads((root / 'recommendations/ci/vendor/sandbox-source.json').read_text())
                  actual[name] = {'commit': manifest['commit'], 'archive_sha256': manifest['sha256']}
              else:
                  actual[name] = {'commit': subprocess.check_output(['git', '-C', str(root / name), 'rev-parse', 'HEAD'], text=True).strip()}
          (root / 'tests/ci/observed-source-refs.json').write_text(json.dumps(actual, indent=2) + '\n')
          PYSOURCES

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install API and browser dependencies
        working-directory: workspace/tests
        run: |
          python -m pip install -r requirements.txt
          npm --prefix user-simulation ci --registry=https://registry.npmjs.org
          cd user-simulation && npx playwright install --with-deps chromium

      - name: Verify reporting privacy and browser types
        working-directory: workspace/tests
        run: |
          python -m pytest unit_tests
          make simulation-check simulation-privacy

      - name: Prepare dedicated stack
        working-directory: workspace/infra
        run: |
          ./scripts/prepare-env.sh .env
          python3 - <<'PYENV'
          from pathlib import Path
          path = Path('.env')
          updates = {'SANDBOX_EXECUTOR_TYPE': 'gojudge', 'SANDBOX_FEATURE_FAKE_EXECUTOR': 'false',
                     'SANDBOX_FEATURE_GOJUDGE_EXECUTOR': 'true', 'MEDIA_TOOL_PLATFORM': 'linux/amd64',
                     'CORS_ORIGINS': 'http://127.0.0.1:3000,http://localhost:3000'}
          lines = path.read_text().splitlines()
          path.write_text('\n'.join(line.partition('=')[0] + '=' + updates.pop(line.partition('=')[0])
                                     if line.partition('=')[0] in updates else line for line in lines)
                          + '\n' + '\n'.join(k + '=' + v for k, v in updates.items()) + '\n')
          PYENV

      - name: Start real services and code executor
        working-directory: workspace/infra
        env:
          GOPROXY: https://proxy.golang.org,direct
          COMPOSE_PARALLEL_LIMIT: "2"
        run: docker compose --profile sandbox --profile gojudge up --build -d --wait --wait-timeout 600

      - name: API and browser student/author journeys
        id: journeys
        working-directory: workspace/tests
        run: python scripts/run_e2e.py --infra-env ../infra/.env

      - name: Upload sanitized test evidence
        if: always() && steps.journeys.outputs.evidence_safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            workspace/tests/allure-results/
            workspace/tests/user-simulation/artifacts/live-results/
            workspace/tests/user-simulation/artifacts/live-results.json
            workspace/tests/ci/source-refs.json
            workspace/tests/ci/observed-source-refs.json
          if-no-files-found: warn

      - name: Stop dedicated CI stack
        if: always()
        working-directory: workspace/infra
        run: |
          if [ -f .env ]; then
            docker compose --profile sandbox --profile gojudge down --remove-orphans
          fi
